name: Unity CI

on: 
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Activate Unity license
      uses: game-ci/unity-activate@v2
      with:
        activateMethod: manual
        unityVersion: 6000.0.37f1
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    - uses: actions/cache@v3
      with:
        path: Library
        key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-

    - name: Build project
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      with:
        targetPlatform: Android

    - uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: build/Android/Android.apk

  firebase-test-lab:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug.apk

    - name: Display structure of downloaded files
      run: ls -R

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_FIREBASE_CREDENTIALS }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Running tests in Firebase Test Lab'
      run: |
        if [ -f Android.apk ]; then
          gcloud firebase test android run --app Android.apk --type robo --device model=MediumPhone.arm,version=30,locale=en,orientation=portrait
        else
          echo "APK not found"
          exit 1
        fi
